{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tannoy{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'events/img/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="64x64" href="{% static 'events/img/favicon-64.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'events/img/favicon-180.png' %}">
  <link rel="stylesheet" href="{% static 'events/css/vanilla-framework-4.62.3.min.css' %}">
  <link rel="stylesheet" href="{% static 'events/css/vanilla-icons.css' %}">
  <style>
    .duration-icon {
      width: 1rem;
      height: 1rem;
      vertical-align: -0.125rem;
    }
    .p-panel__header {
      align-items: center;
    }
    .tannoy-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      margin-right: 0.5rem;
      border-radius: 50%;
      background: #e95420;
      vertical-align: middle;
    }
    .tannoy-logo {
      height: 1.25rem;
      width: auto;
      filter: invert(1);
    }
    .speaker-headshot {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="l-application" role="presentation">
    <div class="l-navigation-bar">
      <div class="p-panel is-dark">
        <div class="p-panel__header">
          <a class="p-panel__logo" href="{% url 'submissions' %}" aria-label="Tannoy home">
            <span class="tannoy-logo-badge"><img class="tannoy-logo" src="{% static 'events/img/bullhorn.svg' %}" alt=""></span>
          </a>
          <p class="p-panel__title u-no-margin--bottom">Tannoy</p>
          <div class="p-panel__controls">
            <button type="button" class="p-panel__toggle js-menu-toggle" aria-controls="site-navigation" aria-expanded="false">Menu</button>
          </div>
        </div>
      </div>
    </div>

    <header class="l-navigation is-collapsed" id="site-navigation">
      <div class="l-navigation__drawer">
        <div class="p-panel is-dark">
          <div class="p-panel__header">
            <a class="p-panel__logo" href="{% url 'submissions' %}" aria-label="Tannoy home">
              <span class="tannoy-logo-badge"><img class="tannoy-logo" src="{% static 'events/img/bullhorn.svg' %}" alt=""></span>
            </a>
            <p class="p-panel__title u-no-margin--bottom">Tannoy</p>
          </div>
          <div class="p-panel__content">
            <nav aria-label="Main navigation">
              <ul class="p-side-navigation__list">
                <li class="p-side-navigation__item">
                  <a class="p-side-navigation__link" href="{% url 'submissions' %}"{% if section == 'submissions' %} aria-current="page"{% endif %}>
                    <span class="p-side-navigation__label">Submissions</span>
                  </a>
                </li>
                <li class="p-side-navigation__item">
                  <a class="p-side-navigation__link" href="{% url 'events' %}"{% if section == 'events' %} aria-current="page"{% endif %}>
                    <span class="p-side-navigation__label">Events</span>
                  </a>
                </li>
                <li class="p-side-navigation__item">
                  <a class="p-side-navigation__link" href="{% url 'admin:index' %}">
                    <span class="p-side-navigation__label">My account</span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </header>

    <main class="l-main">
      <div class="u-fixed-width">
        <div class="grid-row">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var toggle = document.querySelector('.js-menu-toggle');
      var navigation = document.querySelector('.l-navigation');
      if (!toggle || !navigation) {
        return;
      }
      toggle.addEventListener('click', function () {
        var collapsed = navigation.classList.toggle('is-collapsed');
        toggle.setAttribute('aria-expanded', String(!collapsed));
      });
    })();
  </script>
</body>
</html>
